name: CodeQL

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "packages/**/*.ts"
      - "scripts/**/*.ts"
      - "examples/**/*.ts"
      - "*.ts"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "packages/**/*.ts"
      - "scripts/**/*.ts"
      - "examples/**/*.ts"
      - "*.ts"
      - "package.json"
      - "bun.lock"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: "/language:javascript-typescript"
