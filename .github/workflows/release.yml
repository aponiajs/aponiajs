name: Release and publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify synchronized version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_version="$(git show "$BEFORE_SHA:package.json" | jq -r '.version // "0.0.0"')"
          BASE_VERSION="$base_version" bun run release:verify

      - name: Read release version
        id: version
        run: echo "value=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "AponiaJS v$VERSION" \
            --generate-notes

  publish:
    name: Publish release
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: latest
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
