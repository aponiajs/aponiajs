name: Publish npm packages

on:
  workflow_call:
    inputs:
      tag:
        description: npm distribution tag, or auto to derive it from the version
        required: false
        default: auto
        type: string
      version:
        description: Expected package version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: auto
        type: choice
        options:
          - auto
          - latest
          - alpha
          - beta
          - rc
          - next
          - canary
      version:
        description: Expected package version (optional)
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun ci

      - name: Resolve distribution tags
        id: distribution
        run: bun run release:tag

      - name: Reject a distribution tag the version does not allow
        env:
          REQUESTED_TAG: ${{ inputs.tag || 'auto' }}
          RESOLVED_TAG: ${{ steps.distribution.outputs.tag }}
          ALIAS_TAGS: ${{ steps.distribution.outputs.aliases }}
          VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          if [ "$REQUESTED_TAG" = "auto" ]; then
            echo "Publishing $VERSION to $RESOLVED_TAG."
            exit 0
          fi
          for allowed in $RESOLVED_TAG $ALIAS_TAGS; do
            if [ "$REQUESTED_TAG" = "$allowed" ]; then
              exit 0
            fi
          done
          echo "Version $VERSION may only be published under: $RESOLVED_TAG $ALIAS_TAGS." >&2
          exit 1

      - name: Verify workspace
        run: |
          bun run check
          bun test
          bun run test:vite-plus
          bun run build
          bun run test:generated-app

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          RELEASE_TAG: ${{ steps.distribution.outputs.tag }}
        run: bun run release:verify

      - name: Pack publishable workspaces
        run: |
          mkdir -p release-artifacts/{01-common,02-core,03-platform-elysia,04-cli,05-create-aponia}
          bun pm pack --cwd packages/common --destination "$GITHUB_WORKSPACE/release-artifacts/01-common"
          bun pm pack --cwd packages/core --destination "$GITHUB_WORKSPACE/release-artifacts/02-core"
          bun pm pack --cwd packages/platform-elysia --destination "$GITHUB_WORKSPACE/release-artifacts/03-platform-elysia"
          bun pm pack --cwd packages/cli --destination "$GITHUB_WORKSPACE/release-artifacts/04-cli"
          bun pm pack --cwd packages/create-aponia --destination "$GITHUB_WORKSPACE/release-artifacts/05-create-aponia"

      - name: Publish packages in dependency order
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.distribution.outputs.tag }}
        run: |
          for archive in "$GITHUB_WORKSPACE"/release-artifacts/*/*.tgz; do
            npm publish "$archive" --access public --tag "$NPM_TAG" --provenance
          done

      - name: Point alias tags at the published version
        if: steps.distribution.outputs.aliases != ''
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ALIAS_TAGS: ${{ steps.distribution.outputs.aliases }}
          VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          for package in @aponiajs/common @aponiajs/core @aponiajs/platform-elysia @aponiajs/cli create-aponia; do
            for alias in $ALIAS_TAGS; do
              npm dist-tag add "$package@$VERSION" "$alias"
            done
          done
