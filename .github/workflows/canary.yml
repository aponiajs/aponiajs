name: Publish canary build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Stamp and publish a canary build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun ci

      - name: Stamp the canary version
        id: canary
        run: bun run release:canary

      - name: Verify workspace
        run: |
          bun run check
          bun run test:coverage
          bun run test:examples
          bun run test:vite-plus
          bun run build
          bun run test:generated-app
          bun run release:dry-run
          bun audit --audit-level=high

      - name: Verify the stamped version
        env:
          RELEASE_VERSION: ${{ steps.canary.outputs.version }}
          RELEASE_TAG: canary
        run: bun run release:verify

      - name: Pack publishable workspaces
        run: |
          mkdir -p canary-artifacts/{01-common,02-core,03-platform-core,04-platform-elysia,05-cli,06-create-aponia,07-devtools,08-cron,09-graphql,10-testing,11-openapi,12-cors,13-opentelemetry,14-mcp,15-cache,16-events,17-http,18-rate-limit,19-security,20-session,21-compression,22-auth,23-audit,24-tenancy,25-queue,26-database,27-metrics,28-idempotency,29-microservices,30-serverless,31-h3,32-hono,33-nitro,34-store-redis,35-view}
          bun pm pack --cwd packages/common --destination "$GITHUB_WORKSPACE/canary-artifacts/01-common"
          bun pm pack --cwd packages/core --destination "$GITHUB_WORKSPACE/canary-artifacts/02-core"
          bun pm pack --cwd packages/platform-core --destination "$GITHUB_WORKSPACE/canary-artifacts/03-platform-core"
          bun pm pack --cwd packages/platform-elysia --destination "$GITHUB_WORKSPACE/canary-artifacts/04-platform-elysia"
          bun pm pack --cwd packages/cli --destination "$GITHUB_WORKSPACE/canary-artifacts/05-cli"
          bun pm pack --cwd packages/create-aponia --destination "$GITHUB_WORKSPACE/canary-artifacts/06-create-aponia"
          bun pm pack --cwd packages/devtools --destination "$GITHUB_WORKSPACE/canary-artifacts/07-devtools"
          bun pm pack --cwd packages/cron --destination "$GITHUB_WORKSPACE/canary-artifacts/08-cron"
          bun pm pack --cwd packages/graphql --destination "$GITHUB_WORKSPACE/canary-artifacts/09-graphql"
          bun pm pack --cwd packages/testing --destination "$GITHUB_WORKSPACE/canary-artifacts/10-testing"
          bun pm pack --cwd packages/openapi --destination "$GITHUB_WORKSPACE/canary-artifacts/11-openapi"
          bun pm pack --cwd packages/cors --destination "$GITHUB_WORKSPACE/canary-artifacts/12-cors"
          bun pm pack --cwd packages/opentelemetry --destination "$GITHUB_WORKSPACE/canary-artifacts/13-opentelemetry"
          bun pm pack --cwd packages/mcp --destination "$GITHUB_WORKSPACE/canary-artifacts/14-mcp"
          bun pm pack --cwd packages/cache --destination "$GITHUB_WORKSPACE/canary-artifacts/15-cache"
          bun pm pack --cwd packages/events --destination "$GITHUB_WORKSPACE/canary-artifacts/16-events"
          bun pm pack --cwd packages/http --destination "$GITHUB_WORKSPACE/canary-artifacts/17-http"
          bun pm pack --cwd packages/rate-limit --destination "$GITHUB_WORKSPACE/canary-artifacts/18-rate-limit"
          bun pm pack --cwd packages/security --destination "$GITHUB_WORKSPACE/canary-artifacts/19-security"
          bun pm pack --cwd packages/session --destination "$GITHUB_WORKSPACE/canary-artifacts/20-session"
          bun pm pack --cwd packages/compression --destination "$GITHUB_WORKSPACE/canary-artifacts/21-compression"
          bun pm pack --cwd packages/auth --destination "$GITHUB_WORKSPACE/canary-artifacts/22-auth"
          bun pm pack --cwd packages/audit --destination "$GITHUB_WORKSPACE/canary-artifacts/23-audit"
          bun pm pack --cwd packages/tenancy --destination "$GITHUB_WORKSPACE/canary-artifacts/24-tenancy"
          bun pm pack --cwd packages/queue --destination "$GITHUB_WORKSPACE/canary-artifacts/25-queue"
          bun pm pack --cwd packages/database --destination "$GITHUB_WORKSPACE/canary-artifacts/26-database"
          bun pm pack --cwd packages/metrics --destination "$GITHUB_WORKSPACE/canary-artifacts/27-metrics"
          bun pm pack --cwd packages/idempotency --destination "$GITHUB_WORKSPACE/canary-artifacts/28-idempotency"
          bun pm pack --cwd packages/microservices --destination "$GITHUB_WORKSPACE/canary-artifacts/29-microservices"
          bun pm pack --cwd packages/serverless --destination "$GITHUB_WORKSPACE/canary-artifacts/30-serverless"
          bun pm pack --cwd packages/h3 --destination "$GITHUB_WORKSPACE/canary-artifacts/31-h3"
          bun pm pack --cwd packages/hono --destination "$GITHUB_WORKSPACE/canary-artifacts/32-hono"
          bun pm pack --cwd packages/nitro --destination "$GITHUB_WORKSPACE/canary-artifacts/33-nitro"
          bun pm pack --cwd packages/store-redis --destination "$GITHUB_WORKSPACE/canary-artifacts/34-store-redis"
          bun pm pack --cwd packages/view --destination "$GITHUB_WORKSPACE/canary-artifacts/35-view"

      - name: Publish packages in dependency order
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for archive in "$GITHUB_WORKSPACE"/canary-artifacts/*/*.tgz; do
            npm publish "$archive" --access public --tag canary --provenance
          done
