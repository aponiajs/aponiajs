name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="$BEFORE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          base_version="$(git show "$base_sha:package.json" | jq -r '.version // "0.0.0"')"
          BASE_VERSION="$base_version" bun run release:verify

      - name: Install frozen dependencies
        run: bun ci

      - name: Run Vite+ checks through Bun
        run: bun run check

      - name: Run Bun tests
        run: bun test

      - name: Run Vite+ conformance tests
        run: bun run test:vite-plus

      - name: Build workspace packages
        run: bun run build

  benchmark:
    name: Elysia overhead
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Build workspace packages
        run: bun run build

      - name: Compare Elysia and Aponia
        env:
          APONIA_BENCH_REQUEST_MS: 3000
          APONIA_BENCH_STARTUP_MS: 1500
          APONIA_BENCH_WARMUP_MS: 500
        run: bun run benchmark:elysia:run

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: elysia-overhead-${{ github.run_id }}
          path: |
            .ecc/benchmarks/elysia-overhead.json
            assets/benchmarks/elysia-overhead.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
