name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="$BEFORE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          base_version="$(git show "$base_sha:package.json" | jq -r '.version // "0.0.0"')"
          BASE_VERSION="$base_version" bun run release:verify

      - name: Install frozen dependencies
        run: bun ci

      - name: Run Vite+ checks through Bun
        run: bun run check

      - name: Run Bun tests
        run: bun test

      - name: Run Vite+ conformance tests
        run: bun run test:vite-plus

      - name: Build workspace packages
        run: bun run build

      - name: Verify a packaged generated application
        run: bun run test:generated-app

  benchmark:
    name: Upstream HTTP benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APONIA_BENCHMARK_BOMBARDIER_VERSION: v1.2.6
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Bombardier
        run: |
          go install github.com/codesenberg/bombardier@v1.2.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: bun ci

      - name: Build workspace packages
        run: bun run build

      - name: Run the upstream Aponia and Elysia treatments
        run: bun run benchmark:upstream:run

      - name: Upload raw benchmark data
        uses: actions/upload-artifact@v7
        with:
          name: bun-http-framework-benchmark-${{ github.run_id }}
          path: .benchmark-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish raw benchmark data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: benchmark-results
          publish_dir: ./.benchmark-output
          force_orphan: true
          full_commit_message: "chore(benchmark): publish ${{ github.sha }}"
