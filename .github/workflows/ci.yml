name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Require a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="$BEFORE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          base_version="$(git show "$base_sha:package.json" | jq -r '.version // "0.0.0"')"
          BASE_VERSION="$base_version" bun run release:verify

      - name: Report the distribution tag this version would publish to
        run: bun run release:tag

  quality:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Run Vite+ checks through Bun
        run: bun run check

  bun_tests:
    name: Bun tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Run Bun tests with coverage
        run: bun run test:coverage

  conformance:
    name: Vite+ conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Run Vite+ conformance tests
        run: bun run test:vite-plus

  integration:
    name: Example applications
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Run the example end-to-end suites
        run: bun run test:examples

  packaging:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Build workspace packages
        run: bun run build

      - name: Verify a packaged generated application
        run: bun run test:generated-app

      - name: Verify publishable package contents
        run: bun run release:dry-run

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun ci

      - name: Reject high-severity dependency advisories
        run: bun audit --audit-level=high

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  verify:
    name: Verify
    if: always()
    needs:
      - version
      - quality
      - bun_tests
      - conformance
      - integration
      - packaging
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI lane to pass
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUN_TESTS_RESULT: ${{ needs.bun_tests.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$VERSION_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$BUN_TESTS_RESULT" = "success"
          test "$CONFORMANCE_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$PACKAGING_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
